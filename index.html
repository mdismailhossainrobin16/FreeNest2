<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fork: Lightbeams 1.4</title>
  <style>
    html, body, canvas { margin: 0; padding: 0; border: 0; }
    body {
      background: #333;
      overflow: hidden;
    }
    canvas {
      background: black;
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js"></script>
  <script>
var App = {};

jQuery(document).ready(function() {
  // Setup canvas and app
  App.setup();
  // Launch animation loop
  App.frame = function(timestamp) {
    App.update(timestamp);
    window.requestAnimationFrame(App.frame);
  };
  window.requestAnimationFrame(App.frame);
});

App.setup = function() {
  // Setup canvas and get canvas context
  var canvas = document.createElement('canvas');
  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;
  canvas.id = 'ourCanvas';
  document.body.appendChild(canvas);
  this.ctx = canvas.getContext('2d');
  this.width = canvas.width;
  this.height = canvas.height;
  
  // Define a few useful elements
  this.particles = [];
  this.stepCount = 0;
  this.xC = canvas.width / 2;
  this.yC = canvas.height / 2;
  this.birthPeriod = 5;
  this.maxPop = 50;
};
App.update = function(timestamp) {
  // Evolve system
  this.evolve();
  // Move particles
  this.move();
  // Draw particles
  this.draw(timestamp);
};
App.evolve = function() {
  this.stepCount++;
  if (this.stepCount % this.birthPeriod == 0 && this.particles.length < this.maxPop) {
    this.birth();
  }
  if (this.stepCount == 50) this.kill('seed10');
};
App.birth = function() {
  var particle = {
    x: this.width * Math.random(),
    y: this.height * (0.5 + 0.5 * Math.random()),
    xSpeed: 0,
    ySpeed: 0,
    name: 'seed' + this.stepCount
  };
  
  this.particles.push(particle);
};
App.kill = function(particleName) {
 this.particles = _(this.particles).reject(function(seed) {
    return (seed.name == particleName);
  });
};
App.move = function() {
  for (var i = 0; i < this.particles.length; i++) {
    var particle = this.particles[i];
    particle.y -= 4;
    if (particle.y < 0) this.kill(particle.name);
  }
};
App.draw = function(timestamp) {
  // Add 99% transparent layer to canvas
  this.ctx.save()
  this.ctx.globalAlpha = 0.01
  this.ctx.fillStyle = '#444';
  this.ctx.fillRect(0, 0, this.width, this.height);
  this.ctx.restore()
  
  
  // Draw particles
  for (var i = 0; i < this.particles.length; i++) {
    var particle = this.particles[i];
    var distance = Math.sqrt(Math.pow(particle.x - this.xC, 2) + Math.pow(particle.y - this.yC, 2));
    
    var rParticle = distance;
    // Draw particle
    for (let angle = 0; angle < Math.PI * 2; angle += 0.1) {
      const xOffset = this.width * 0.04
      const yOffset = this.height * 0.3
      const startX = particle.x + Math.cos(angle) * rParticle
      const startY = particle.y + Math.sin(angle) * rParticle
      
      if (startX < (this.width / 2 + xOffset) 
      && startX > (this.width / 2 - xOffset)
      && startY < (this.height / 2 + yOffset) 
      && startY > (this.height / 2 - yOffset)
         ) {
        this.ctx.save()
        this.ctx.translate(this.width/2, this.height/2)
        this.ctx.rotate(timestamp / 5000)
        this.ctx.translate(-this.width/2, -this.height/2)
        this.ctx.beginPath();
        this.ctx.moveTo(
          startX,
          startY
        )
        this.ctx.lineTo(
          particle.x + Math.cos(angle + 0.1) * rParticle,
          particle.y + Math.sin(angle + 0.1) * rParticle
        )
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        this.ctx.stroke();
        this.ctx.restore()
      }
    }
    // this.ctx.arc(particle.x, particle.y, rParticle, 0, 2 * Math.PI, false);
  }
};
  </script>
</body>
</html>
