<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Clock (BC17 Braun x Paul Smith)</title>
    <style>
* {
  box-sizing: border-box;
}

:root {
  --color-bg-top-left: #474447;
  --color-bg-bottom-right: #0E0E0E;
  --color-shadow: #080606;
  --color-numerals: #CFD8DF;
  --color-dial-base: #060201;
  --color-dial-highlight: #D3DADE;
  --dim-max-width: 800px;
  --dim-min-width: calc(100vw - 40px);
  --font-size-numerals: min(5vw, 38px);
  --dim-clock-size: min(var(--dim-max-width), var(--dim-min-width));
  --dim-numerals-offset: calc(var(--dim-clock-size) * -0.415);
  --dim-dash-offset: calc(var(--dim-clock-size) * -0.462);
  --dim-dash-size: calc(var(--dim-clock-size) * 0.023);
  --dim-center-size:calc(var(--dim-clock-size) * 0.048);
  --dim-dash-width: calc(var(--dim-dash-size) * 0.2);
  --dim-hour-hand-height: calc(var(--dim-clock-size) * 0.28);
  --dim-hour-hand-width: calc(var(--dim-hour-hand-height) * 0.07);
  --dim-minute-hand-height: calc(var(--dim-clock-size) * 0.37);
  --dim-minute-hand-width: calc(var(--dim-minute-hand-height) * 0.04);
  --dim-second-hand-height: calc(var(--dim-clock-size) * 0.48);
  --dim-second-hand-width: calc(var(--dim-second-hand-height) * 0.02);
  --dim-inner-rim-size: 76%;
}

body, html {
  padding: 0;
  margin: 0;
  background-color: #ccc;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100vw;
  height: 100vh;
}

.clock {
  position: relative;
  aspect-ratio: 1;
  flex: 1;
  max-width: var(--dim-clock-size);
  border-radius: 50%;
  background-image: linear-gradient(to bottom right, var(--color-bg-top-left), var(--color-bg-bottom-right) 60%);
  border: 2px solid var(--color-bg-bottom-right);
  box-shadow: inset 1px 1px 1px 0px rgba(255, 255, 255, 0.25);
  overflow: hidden;
}

.outer-rim {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  position: absolute;
  margin: auto;
  width: 97%;
  aspect-ratio: 1;
  border-radius: 50%;
  background-color: transparent;
  box-shadow: inset 3px 3px 24px 16px var(--color-shadow);
}

.outer-rim {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  position: absolute;
  margin: auto;
  width: 97.5%;
  aspect-ratio: 1;
  border-radius: 50%;
  background-color: transparent;
  box-shadow: inset -1px -1px 1px 0px rgba(255, 255, 255, 0.2), inset 3px 3px 24px 16px var(--color-shadow);
}

.outer-rim--faint {
  z-index: 4;
  opacity: 0.66;
}

.inner-rim {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: var(--dim-inner-rim-size);
  aspect-ratio: 1;
  margin: auto;
  border-radius: 50%;
  box-shadow: inset 3px 3px 12px var(--color-shadow), inset -2px -2px 3px 0px rgba(255, 255, 255, 0.08), -1px -1px 2px 0 var(--color-shadow);
}

.numbers {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 0;
  height: 0;
  margin: auto;
  overflow: visible;
  font-family: Helvetica, Arial, sans-serif;
}

.numbers__number {
  color: var(--color-numerals);
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 0;
  height: 0;
  overflow: visible;
  font-size: var(--font-size-numerals);
  text-shadow: 0 0 1px var(--color-numerals);
}

.numbers__dash {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 0;
  height: 0;
  overflow: visible;
}
.numbers__dash span {
  display: block;
  width: var(--dim-dash-width);
  height: var(--dim-dash-size);
  background-color: var(--color-numerals);
  border-radius: 1px;
  flex: 1;
  color: transparent;
}

.dial {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: visible;
  width: 2px;
  height: 2px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dial__hand {
  position: absolute;
  width: var(--dim-hour-hand-width);
  height: var(--dim-hour-hand-height);
  transform-origin: 50% 100%;
  bottom: 0;
  left: 0;
  border-radius: 3px;
  background-image: linear-gradient(to top, var(--color-dial-base), var(--color-dial-base) 40%, var(--color-dial-highlight) 40.5%);
  box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.4);
}

.dial__container {
  position: absolute;
  inset: 0;
}

.dial__container--seconds {
  animation-duration: 60s;
  animation-name: rotation;
  animation-iteration-count: infinite;
  animation-timing-function: steps(480, end);
  z-index: 2;
}

.dial__container--minutes {
  animation-duration: 3600s;
  animation-name: rotation;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  z-index: 1;
}

.dial__container--hours {
  animation-duration: 43200s;
  animation-name: rotation;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  z-index: 1;
}

@keyframes rotation {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.dial__hand--minute {
  width: var(--dim-minute-hand-width);
  height: var(--dim-minute-hand-height);
  box-shadow: 2px 2px 8px black;
}

.dial__second {
  position: absolute;
  width: var(--dim-second-hand-width);
  height: var(--dim-second-hand-height);
  transform-origin: 50% 100%;
  bottom: 0;
  left: calc(var(--dim-second-hand-width) / -2);
  z-index: 2;
}
.dial__second::after {
  content: "";
  position: absolute;
  inset: 0;
  clip-path: polygon(0 100%, 100% 100%, 80% 0, 20% 0);
  border-radius: 12px 12px 4px 4px;
  background-image: linear-gradient(to top, #2D7287, #2D7287 10%, #F56F4F 10%, #F56F4F 40%, #EF852B 40%, #EF852B 60%, #E3BAAF 60%, #E3BAAF 76%, #9ECBAF 76%);
}
.dial__second::before {
  content: "";
  position: absolute;
  inset: 0;
  background-color: black;
  opacity: 0.4;
  filter: blur(3px);
}

.dial__second-back {
  position: absolute;
  width: calc(var(--dim-second-hand-width) * 3);
  height: calc(var(--dim-second-hand-height) * 0.23);
  border-radius: 10px;
  bottom: 0;
  left: calc(var(--dim-second-hand-width) * -1.5);
  z-index: 2;
  transform-origin: 50% 100%;
  background-image: linear-gradient(to top, #2D7287, #2D7287 40%, #148BA5 40%);
}

.dial__center {
  width: var(--dim-center-size);
  height: var(--dim-center-size);
  border-radius: 50%;
  position: absolute;
  background-color: #2D7287;
  z-index: 3;
}
.dial__center::before, .dial__center::after {
  position: absolute;
  inset: 20%;
  aspect-ratio: 1;
  background-color: #366269;
  content: "";
  border-radius: 50%;
  box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.66);
}
.dial__center::after {
  inset: calc(20% + 1px);
  box-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.12);
}

.logo {
  position: absolute;
  width: 7.5%;
  aspect-ratio: 2.3;
  height: auto;
  top: 25%;
  left: 0;
  right: 0;
  margin: auto;
  z-index: 1;
}
.logo img {
  width: 100%;
  height: 100%;
}

.logo--ps {
  top: auto;
  width: 14%;
  bottom: 25%;
  aspect-ratio: 5;
}
.logo--ps img {
  width: 100%;
}
    </style>

  </head>
    
  <body>
  <!-- BC17 Braun x Paul Smith -->
<!-- https://braun-clocks.com/products/braun-x-paul-smith-limited-edition-classic-large-analogue-wall-clock-black -->

<div class="clock">
    <div class="logo logo--braun"><img src="https://assets.codepen.io/215059/clock-braun-logo.svg" alt="Braun logo" /></div>
    <div class="logo logo--ps"><img src="https://assets.codepen.io/215059/clock-paul-smith-logo.svg" alt="Paul Smith logo" /></div>
    <div class="outer-rim"></div>
    <div class="outer-rim outer-rim--faint"></div>
    <div class="inner-rim"></div>
    <div class="numbers">
<!--  Hatches  -->
      <template id="dash-template">
        <span class="numbers__dash" style="transform: rotate(0deg) translateY(var(--dim-dash-offset));">
          <span>&nbsp;</span>
        </span>
      </template>
<!--  Hour numbers  -->
      <template id="hour-template">
        <div class="numbers__number" style="transform: rotate(0deg) translateY(var(--dim-numerals-offset));">
          <span></span>
        </div>
      </template>
    </div>

    <div class="dial">
      <div class="dial__container dial__container--seconds">
        <div class="dial__second" style="transform: rotate(220deg);"></div>
        <div class="dial__second-back" style="transform: rotate(40deg);"></div>
      </div>

      <div class="dial__container dial__container--minutes">
        <div class="dial__hand dial__hand--minute" style="transform: rotate(40deg)"></div>
      </div>
      <div class="dial__container dial__container--hours">
        <div class="dial__hand" style="transform: rotate(-40deg)"></div>
      </div>
      <div class="dial__center"></div>
    </div>
  </div>
    <script>
"use strict";
// Everything here can be done with server rendering - no JS client code required
const HOUR_COUNT = 12;
const MINUTE_COUNT = 60;
const HOUR_ANGLE_INCREMENT = 360 / HOUR_COUNT;
const MINUTE_ANGLE_INCREMENT = 360 / MINUTE_COUNT;
const container = document.querySelector(".numbers");
const dashTemplate = document.getElementById("dash-template");
const hourTemplate = document.getElementById("hour-template");
// Check for required elements
if (!container || !dashTemplate || !hourTemplate) {
    console.error("Error: Clock templates or container not found.");
    throw new Error("Missing required DOM elements.");
}
// -------------------------------------------------------------------
// 1. Generate Hour Numerals (12 through 11)
// -------------------------------------------------------------------
for (let i = 0; i < HOUR_COUNT; i++) {
    const hour = i === 0 ? 12 : i;
    const rotationAngle = i * HOUR_ANGLE_INCREMENT; // 0, 30, 60, ..., 330
    const clone = hourTemplate.content.cloneNode(true);
    const numberDiv = clone.firstElementChild;
    if (numberDiv) {
        numberDiv.style.transform = `rotate(${rotationAngle}deg) translateY(var(--dim-numerals-offset))`;
        const numberSpan = numberDiv.querySelector("span");
        if (numberSpan) {
            numberSpan.textContent = String(hour);
            numberSpan.style.transform = `rotate(${-rotationAngle}deg)`;
            if (hour === 12) {
                numberSpan.classList.add("digits");
            }
        }
        container.appendChild(clone);
    }
}
// -------------------------------------------------------------------
// 2. Generate Minute/Second Dashes (60 dashes)
// -------------------------------------------------------------------
for (let i = 0; i < MINUTE_COUNT; i++) {
    const rotationAngle = i * MINUTE_ANGLE_INCREMENT; // 0, 6, 12, ..., 354
    const clone = dashTemplate.content.cloneNode(true);
    const dashElement = clone.firstElementChild;
    if (dashElement) {
        dashElement.style.transform = `rotate(${rotationAngle}deg) translateY(var(--dim-dash-offset))`;
        // Mark every 5th dash as an hour marker
        if (i % 5 === 0) {
            dashElement.classList.add("numbers__dash--major");
        }
        container.appendChild(clone);
    }
}
// Function to calculate the rotation angles based on the current time
function getClockAngles() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const secondsRotation = seconds * 6;
    const minutesRotation = minutes * 6 + seconds * 0.1; // 6 / 60 = 0.1
    const twelveHour = hours % 12;
    const hoursRotation = twelveHour * 30 + minutes * 0.5; // 30 / 60 = 0.5
    return {
        seconds: secondsRotation,
        minutes: minutesRotation,
        hours: hoursRotation,
    };
}
// Function to apply the calculated rotations to the CSS
function updateClockHands() {
    const angles = getClockAngles();
    const secondHand = document.querySelector(".dial__second");
    const secondBack = document.querySelector(".dial__second-back");
    if (secondHand) {
        secondHand.style.transform = `rotate(${angles.seconds}deg)`;
    }
    if (secondBack) {
        secondBack.style.transform = `rotate(${angles.seconds + 180}deg)`;
    }
    const minuteHand = document.querySelector(".dial__hand--minute");
    if (minuteHand) {
        minuteHand.style.transform = `rotate(${angles.minutes - 1}deg)`;
    }
    const hourHand = document.querySelector(".dial__container--hours .dial__hand");
    if (hourHand) {
        hourHand.style.transform = `rotate(${angles.hours}deg)`;
    }
}
updateClockHands();
    </script>

  </body>
  
</html>
